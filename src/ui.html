<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payroll time ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7;--surface:#FFFFFF;--surface2:#F7F8FA;--ink:#162033;--muted:#566176;--line:#D9DEE6;
  --accent:#1E5C8A;--accent-ink:#FFFFFF;--accent-soft:#E3EEF6;
  --sand:#B87A12;--sand-soft:#FBF1DE;--good:#21754F;--good-soft:#E2F2EA;--bad:#B03B25;--bad-soft:#FBE7E2;
  --rest:#E7EAEF;--focus:#1E5C8A;
  --font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F141D;--surface:#161D29;--surface2:#1B2331;--ink:#E6EBF2;--muted:#9AA5B7;--line:#2B3546;
  --accent:#6EA6D6;--accent-ink:#0F141D;--accent-soft:#1C3347;--sand:#E3AA4C;--sand-soft:#3A2E17;
  --good:#5BBE8E;--good-soft:#173528;--bad:#EE7B63;--bad-soft:#3D1F19;--rest:#222B3A;--focus:#8DBCE6;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F141D;--surface:#161D29;--surface2:#1B2331;--ink:#E6EBF2;--muted:#9AA5B7;--line:#2B3546;
  --accent:#6EA6D6;--accent-ink:#0F141D;--accent-soft:#1C3347;--sand:#E3AA4C;--sand-soft:#3A2E17;
  --good:#5BBE8E;--good-soft:#173528;--bad:#EE7B63;--bad-soft:#3D1F19;--rest:#222B3A;--focus:#8DBCE6;color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:1240px;margin:0 auto;padding:20px clamp(14px,3vw,32px) 64px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:14px}
.brand{flex:1 1 220px;min-width:0}
.brand h1{font-size:15px;font-weight:600;margin:0}
.brand p{margin:0;color:var(--muted);font-size:13px}
.pnav{display:flex;align-items:center;gap:6px}
.pnav .lbl{min-width:190px;text-align:center}
.pnav .lbl b{display:block;font-size:17px;font-weight:600;line-height:1.2}
.pnav .lbl span{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.icon{width:36px;height:36px;padding:0;display:inline-grid;place-items:center;font-size:18px}
.btn.small{padding:4px 9px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:4px 6px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.store{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--good)}.dot.warn{background:var(--sand)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:22px;font-size:14px}
.bar label{display:flex;align-items:center;gap:8px}
.bar input[type=date]{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface2)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;background:var(--rest);white-space:nowrap}
.pill.open{background:var(--accent-soft);color:var(--accent)}.pill.closed{background:var(--rest)}.pill.upcoming{background:var(--sand-soft);color:var(--sand)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--sand-soft);color:var(--sand)}
.spacer{flex:1}
/* hero */
.hero{margin:6px 0 18px}
.headline{font-size:clamp(22px,2.6vw,32px);line-height:1.25;font-weight:500;letter-spacing:-.01em;margin:0 0 6px;max-width:38ch}
.headline .n{font-weight:700}
.sub{color:var(--muted);margin:0 0 18px;max-width:75ch}
.ribbon{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(26px,1fr);gap:3px;overflow-x:auto;padding-bottom:6px}
.tile{display:flex;flex-direction:column;align-items:stretch;gap:3px;border:0;background:none;padding:0;cursor:pointer;min-width:26px}
.tile .col{position:relative;height:96px;border-radius:5px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.tile .fill{position:absolute;inset:auto 0 0 0;background:var(--accent)}
.tile .req{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.55}
.tile.rest .col{background:var(--rest);border-color:transparent}
.tile.rest .fill,.tile.off .fill{background:var(--muted)}
.tile.short .fill{background:var(--sand)}
.tile.zero .col{background:var(--bad-soft);border-color:var(--bad)}
.tile.missing .col{border:1.5px dashed var(--bad);background:repeating-linear-gradient(135deg,transparent 0 5px,var(--bad-soft) 5px 9px)}
.tile.future .col{background:var(--surface2);border-style:dashed}
.tile.today .col{border:2px solid var(--accent)}
.tile.sel .col{box-shadow:0 0 0 2px var(--focus)}
.tile.hol .col,.tile.lv .col{background:repeating-linear-gradient(45deg,var(--accent-soft) 0 6px,var(--surface) 6px 10px);border-color:var(--accent)}
.tile.need .col{border:2px solid var(--sand)}.tile.need .d b{color:var(--sand)}
.tile .mk{position:absolute;top:3px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:700;color:var(--accent)}
.offgrid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,1.7fr);gap:14px}@media (max-width:900px){.offgrid{grid-template-columns:1fr}}
.hl{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center}
.tile .d{font-size:11px;text-align:center;color:var(--muted);line-height:1.1}
.tile .d b{display:block;color:var(--ink);font-weight:500;font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:-2px}
/* metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:22px 0}
.m{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.m.forecast{border-style:dashed;background:var(--surface2)}
.m .k{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.m .v{font-size:24px;font-weight:600;line-height:1.25}
.m .x{font-size:12.5px;color:var(--muted)}
.m details{margin-top:4px;font-size:12.5px;color:var(--muted)}
.m summary{cursor:pointer;color:var(--accent);width:max-content}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);height:max-content}
.tag.fc{border-style:dashed}
/* sections */
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-bottom:22px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font-size:16px;margin:0 0 4px;font-weight:600}
.card h3{font-size:14px;margin:14px 0 4px;font-weight:600}
.card .lead{color:var(--muted);font-size:13.5px;margin:0 0 10px}
.attn{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.attn li{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 10px;border-radius:8px;background:var(--surface2)}
.attn .b{flex:none;margin-top:1px}
.attn li div{flex:1;min-width:0}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;padding:7px 9px;border-radius:7px;white-space:nowrap;z-index:5;display:none;line-height:1.45}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--surface2);position:sticky;top:0}
td.num,th.num{text-align:end}
tr:last-child td{border-bottom:0}
tr.dim td{color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:500;text-decoration:underline;text-underline-offset:2px}
.kv{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:14px;width:max-content;max-width:100%}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:end;font-weight:500}
.big{font-size:28px;font-weight:600;line-height:1.2}
.note{font-size:13px;color:var(--muted)}
.callout{border-inline-start:3px solid var(--sand);background:var(--sand-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13.5px;margin:10px 0}
.callout.bad{border-color:var(--bad);background:var(--bad-soft)}.callout.good{border-color:var(--good);background:var(--good-soft)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:14px}
.field>span{font-weight:500}
.field small{color:var(--muted)}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--surface2);width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row .field{flex:1 1 140px}
.wd{display:flex;flex-wrap:wrap;gap:6px}
.wd label{border:1px solid var(--line);border-radius:7px;padding:4px 9px;display:flex;gap:6px;align-items:center;cursor:pointer}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.dlg{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.dlg header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dlg header h2{margin:0;font-size:18px}
.dlg footer{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;background:var(--surface2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.pv{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pv h3{margin:0;font-size:15px}
.errs{margin:0;padding-inline-start:18px;font-size:13px;color:var(--bad);max-height:160px;overflow:auto}
.warns{margin:0;padding-inline-start:18px;font-size:13px;color:var(--muted);max-height:120px;overflow:auto}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:calc(100vw - 24px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;display:none}
.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.empty h2{margin:0 0 6px}
.dropall{position:fixed;inset:0;background:rgba(30,92,138,.12);border:3px dashed var(--accent);display:none;place-items:center;z-index:40;font-size:20px;font-weight:600;color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.loading{padding:60px;text-align:center;color:var(--muted)}
@media (max-width:640px){.pnav{width:100%;justify-content:space-between}.pnav .lbl{min-width:0;flex:1}.metrics{grid-template-columns:1fr 1fr}.m .v{font-size:20px}}
@media (prefers-reduced-motion:no-preference){.tile .fill{transition:height .35s ease}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Loading your ledger…</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="dropall" id="dropall">Drop Time Doctor exports to preview them</div>
<input type="file" id="fileIn" accept=".csv,.json,text/csv,application/json" multiple hidden>
<dialog id="dlgUp" aria-labelledby="upT"></dialog>
<dialog id="dlgDay" aria-labelledby="dayT"></dialog>
<script>
/*CORE*/
</script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=v=>String(v===null||v===undefined?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS_KEY='twerlo-td-ledger-v1';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WDS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WDL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fd=(d,y)=>{const[Y,M,D]=d.split('-').map(Number);return `${MON[M-1]} ${D}${y?', '+Y:''}`};
const fdw=d=>`${WDS[TD.weekday(d)]}, ${fd(d)}`;
const HM=TD.fmtHM, HMS=TD.fmtHMS;

/* ---------------- state & storage ---------------- */
let S=TD.defaultState(), mode='loading', db=null, ref=null, uid=null, localPending=null;
const ui={key:null,asOf:null,tab:'days',filter:'all',sel:null,uploads:[],showTable:false};
function readLocal(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function writeLocal(st){try{localStorage.setItem(LS_KEY,JSON.stringify(st));return true}catch(e){return false}}
function migrateShape(x){const d=TD.defaultState();if(!x||typeof x!=='object'||!x.days)return null;
  return Object.assign(d,x,{settings:Object.assign(d.settings,x.settings||{}),summaries:x.summaries||[],batches:x.batches||[]});}
async function boot(){
  render();
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const timeout=new Promise(r=>setTimeout(()=>r(null),10000));
      const [d,u]=await Promise.all([Promise.race([window.claude.use('db'),timeout]),Promise.race([window.claude.use('user'),timeout])]);
      if(d&&u){uid=await u.id(); if(uid){db=d; ref=db.doc('data/users/'+uid+'/ledger');}}
    }
  }catch(e){db=null;ref=null}
  if(ref){
    try{const snap=await ref.get();
      if(snap.exists){S=migrateShape(JSON.parse(JSON.stringify(snap.data())))||TD.defaultState();}
      else{const loc=readLocal(); if(loc&&Object.keys(loc.days||{}).length) localPending=migrateShape(loc);}
      mode='account';
    }catch(e){mode='local';const loc=readLocal();if(loc)S=migrateShape(loc)||S;}
  }else{mode='local';const loc=readLocal();if(loc)S=migrateShape(loc)||S;}
  render();
  window.addEventListener('focus',refreshRemote);
}
async function refreshRemote(){
  if(mode!=='account'||!ref)return;
  try{const snap=await ref.get();if(snap.exists){const r=snap.data();if((r.rev||0)>(S.rev||0)){S=migrateShape(JSON.parse(JSON.stringify(r)));render();toast('Updated with changes from another tab or device.');}}}catch(e){}
}
let saving=false;
async function save(next,msg){
  if(saving){toast('Still saving the previous change. Try again in a moment.');return false;}
  saving=true;
  try{
    next.rev=(S.rev||0)+1;
    const size=JSON.stringify(next).length;
    if(size>240000){toast('The ledger is close to its storage limit. Export a backup and remove old import history.');}
    if(mode==='account'){
      const cur=await ref.get();
      const remoteRev=cur.exists?(cur.data().rev||0):0;
      if(remoteRev!==(S.rev||0)){S=migrateShape(JSON.parse(JSON.stringify(cur.data())));render();toast('This ledger changed in another tab. Your change was not saved; review and try again.');return false;}
      await ref.set(JSON.parse(JSON.stringify(next)));
    }else if(!writeLocal(next)){toast('This browser blocked saving. Your change is only kept until you close the page.');}
    S=next; render(); if(msg)toast(msg); return true;
  }catch(e){toast('Not saved: '+(e&&e.message?e.message:'the store refused the write')+'. Nothing was changed.');return false}
  finally{saving=false}
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',5200)}
const meta=()=>({at:new Date().toISOString(),by:'you'});

/* ---------------- calc ---------------- */
function today(){return TD.todayIn(S.settings.tz)}
function curKey(){return ui.key||TD.periodKeyFor(today())}
function calc(){return TD.computePeriod(S,curKey(),ui.asOf,today())}
function pLabel(P){return `${MONL[P.month-1]} ${P.year}`}

/* ---------------- render ---------------- */
function render(){
  const app=$('#app');
  if(mode==='loading'){app.innerHTML='<div class="loading">Loading your ledger…</div>';return}
  const c=calc(); const P=c.P;
  const has=Object.keys(S.days).length>0||S.summaries.length>0;
  app.innerHTML=`
  <header class="top">
    <div class="brand"><h1>Payroll time ledger</h1><p>${S.person?esc(S.person)+' · ':''}${esc(S.settings.tz)} · ${scheduleText(c.schedule)}</p></div>
    <nav class="pnav" aria-label="Payroll period">
      <button class="btn icon" data-act="prev" aria-label="Previous period">‹</button>
      <div class="lbl" aria-live="polite"><b>${pLabel(P)}</b><span>${fd(P.start,true)} – ${fd(P.end,true)}</span></div>
      <button class="btn icon" data-act="next" aria-label="Next period">›</button>
      ${curKey()!==TD.periodKeyFor(today())?'<button class="btn small" data-act="current">Current</button>':''}
    </nav>
    <div class="store" title="${mode==='account'?'Saved privately to your Claude account. Only you can read it, on any device where you open this page.':'Saved in this browser only. Clearing site data or using another device will not show these entries.'}">
      <span class="dot ${mode==='account'?'ok':'warn'}"></span>${mode==='account'?'Private to your account':'This browser only'}</div>
    <button class="btn" data-act="leave">Add approved day off</button>
    <button class="btn primary" data-act="upload">Upload Time Doctor exports</button>
  </header>
  ${localPending?`<div class="callout"><b>Entries from this browser were found.</b> ${Object.keys(localPending.days).length} dates saved before account storage was available. <button class="btn small" data-act="migrate">Move them to my account</button> <button class="btn ghost" data-act="dismissMigrate">Not now</button></div>`:''}
  <div class="bar">
    <span class="pill ${c.status}">${c.status==='open'?'In progress':c.status==='closed'?'Closed':'Upcoming'}</span>
    <label>As of <input type="date" id="asof" value="${c.asOf}" min="${P.start}" max="${P.end}"></label>
    <label><input type="checkbox" id="incToday" ${S.settings.includeToday?'checked':''} ${c.asOf===P.end&&today()>P.end?'disabled':''}> Count ${c.asOf===today()?'today':fd(c.asOf)} as a remaining workday</label>
    <span class="spacer"></span>
    <span class="note">${coverageText(c)}</span>
  </div>
  ${has?body(c):emptyState()}`;
  bindChart(c);
}
function scheduleText(s){const d=s.workdays.slice().sort();const runs=d.length===5&&d.join()==='0,1,2,3,4'?'Sun–Thu':d.map(x=>WDS[x]).join(', ');return `${runs}, ${HM(s.dailySec)} a day`}
function coverageText(c){
  const lastRec=Object.keys(S.days).filter(d=>typeof S.days[d].t==='number'&&d>=c.P.start&&d<=c.P.end).sort().pop();

function headline(c){

  if(c.final)return `Period closed with <span class="n">${HM(c.tracked)}</span> of ${HM(c.goal)} tracked${c.toGoal?`, <span class="n">${HM(c.toGoal)}</span> short`:''}.`;
  if(!c.toGoal)return `<span class="n">${HM(c.tracked)}</span> tracked. You've reached the ${HM(c.goal)} target.`;
  return `<span class="n">${HM(c.tracked)}</span> of ${HM(c.goal)} tracked. <span class="n">${HM(c.toGoal)}</span> to go${c.workdaysLeft?` over ${c.workdaysLeft} workday${c.workdaysLeft>1?'s':''}`:''}.`;

function dayTypeText(r){const d=r.day||{};const lt=d.leaveType?d.leaveType:'Approved leave';

function attention(c){

    if(I.rec.state==='differ')items.push(['bad','Tracked totals differ',`Daily totals add up to ${HMS(I.rec.sum)}, the Activity Summary says ${HMS(I.summary.tracked)} (${I.rec.diff>0?'+':''}${HMS(I.rec.diff)}). The idle estimate is on hold.`]);

function series(c){

  for(const r of c.rows){exp+=r.req; if(r.date<=c.asOf){cum+=(r.t||0)} pts.push({date:r.date,cum:r.date<=c.asOf?cum:null,exp,req:r.req,t:r.t});}

  if(c.projection&&!c.final){const avg=c.projection.avg;let f=null;
    for(const p of pts){if(p.date===c.asOf){f=p.cum;p.fc=f;continue} if(f!==null&&p.date>c.asOf){if(p.req>0)f+=avg;p.fc=f}}
    const last=pts[pts.length-1]; if(last.fc!==undefined)last.fc=c.projection.finish; }
  return pts;
}
function chartTable(c){const pts=series(c);return `<div class="tablewrap" style="max-height:280px;margin-top:8px"><table><thead><tr><th>Date</th><th class="num">Tracked (cumulative)</th><th class="num">Expected</th><th class="num">Forecast</th></tr></thead><tbody>

function bindChart(c){

  let xl=''; pts.forEach((p,i)=>{if(i===0||i===pts.length-1||p.date.endsWith('-01')||p.date===c.asOf)xl+=`<text x="${x(i)}" y="${Hh-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${fd(p.date)}</text>`});

   ${grid}${xl}
   <line x1="${x(ai)}" x2="${x(ai)}" y1="${pad.t}" y2="${pad.t+ih}" stroke="var(--muted)" stroke-dasharray="2 3"/>
   <path d="${path('exp')}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>
   <path d="${path('fc')}" fill="none" stroke="var(--sand)" stroke-width="2" stroke-dasharray="2 4"/>

   <g id="hov" style="display:none"><line id="hl1" y1="${pad.t}" y2="${pad.t+ih}" stroke="var(--ink)" stroke-opacity=".3"/><circle id="hc" r="4" fill="var(--accent)"/></g>

  </svg><div class="tip" id="tip"></div>

  const hit=box.querySelector('#hit'),tip=box.querySelector('#tip'),hov=box.querySelector('#hov');

    tip.innerHTML=`<b>${fdw(p.date)}</b><br>Tracked: ${p.cum===null?'—':HMS(p.cum)}<br>Expected: ${HMS(p.exp)}${p.fc!==undefined&&p.cum===null?'<br>Forecast: '+HMS(Math.round(p.fc)):''}<br>${stText(c.rows[i].st)}`;
    tip.style.display='block';const sx=x(i)/W*rect.width;tip.style.left=Math.min(rect.width-tip.offsetWidth,Math.max(0,sx-tip.offsetWidth/2))+'px';tip.style.top=Math.max(0,y(v)/Hh*rect.height-tip.offsetHeight-12)+'px'};

async function saveLeave(){
  const s=$('#lvS').value,e=$('#lvE').value,frac=parseFloat($('#lvP').value),part=frac===1?'full':'partial',err=$('#lvErr');
  if(!TD.isValidISO(s)||!TD.isValidISO(e)||s>e){err.textContent='Pick a first day on or before the last day.';return}

  const leaveSec=part==='partial'?Math.round(frac*28800):null;

}

async function saveDay(date){
  const g=id=>$('#dlgDay '+id).value.trim(); const err=$('#dErr');
  const pd=(s,label)=>{const p=TD.parseDuration(s);if(p.error)throw label+': '+p.error;if(p.blank)return null;if(p.sec>TD.DAY_SEC)throw label+' cannot exceed 24 hours.';return p.sec};
  let patch;
  try{
    const t=pd(g('#dT'),'Tracked'),i=pd(g('#dI'),'Idle'),m=pd(g('#dM'),'Meetings'),l=+g('#dL');
    if((i!==null)!==(m!==null))throw 'Enter both idle and meeting time for the day, or neither (use 0 for none).';
    if(t!==null&&i!==null&&i>t)throw 'Idle time cannot be more than tracked time.';
    const k=g('#dK');
    patch={t,idle:i,meet:m,kind:k||null,leaveSec:k==='partial'?l:null,reason:g('#dR')||null,note:g('#dX')||null,
      noAssign:$('#dN').checked?{status:g('#dNs')}:null,offsite:g('#dO')?{ref:g('#dO')}:null};
  }catch(e){err.textContent=String(e);return}
  const next=TD.applyManual(S,date,patch,meta());
  if(await save(next,`Saved ${fd(date)}.`))$('#dlgDay').close();
}

  const dlg=$('#dlgUp'); const U=ui.uploads;
  dlg.innerHTML=`<div class="dlg"><header><div><h2 id="upT">Upload Time Doctor exports</h2><p class="note" style="margin:2px 0 0">Saving for ${S.person?'<b>'+esc(S.person)+'</b>':'the person you confirm below'}. Nothing changes until you apply a file.</p></div><button class="btn icon" data-act="closeUp" aria-label="Close">×</button></header>
   <div class="drop" id="dropz"><p style="margin:0 0 8px">Drop the Hours Tracked (Totals) and Activity Summary CSVs here, together or one at a time.</p><button class="btn" data-act="pick">Choose files</button><p class="note" style="margin:8px 0 0">Also accepts a date,hours CSV and a ledger backup (.json). Up to 2 MB per file.</p></div>
   ${U.map((u,i)=>previewCard(u,i)).join('')}
   <footer><button class="btn" data-act="closeUp">Close</button>${U.some(u=>u.ready&&!u.applied)?`<button class="btn primary" data-act="applyAll">Apply ${U.filter(u=>u.ready&&!u.applied).length>1?'all ready files':'file'}</button>`:''}</footer></div>`;
  const dz=dlg.querySelector('#dropz');
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over')});dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
  dz.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();dz.classList.remove('over');addFiles(e.dataTransfer.files)});
  dlg.querySelectorAll('[data-confirm]').forEach(el=>el.addEventListener('change',e=>{const u=ui.uploads[+e.target.dataset.i];u.confirms[e.target.dataset.confirm]=e.target.checked;evalReady(u);renderUpload()}));
  dlg.querySelectorAll('[data-person]').forEach(el=>el.addEventListener('input',e=>{ui.uploads[+e.target.dataset.i].personInput=e.target.value}));
  dlg.querySelectorAll('[data-person]').forEach(el=>el.addEventListener('change',e=>{const u=ui.uploads[+e.target.dataset.i];evalReady(u);renderUpload()}));
}
async function addFiles(list){
  for(const f of list){
    if(f.size>2*1024*1024){ui.uploads.push({name:f.name,fatal:`${f.name} is ${(f.size/1048576).toFixed(1)} MB. The limit is 2 MB per file.`});continue}
    const text=await f.text();
    if(/\.json$/i.test(f.name)||/^\s*\{/.test(text)){let parsed=null;try{parsed=migrateShape(JSON.parse(text))}catch(e){}
      ui.uploads.push(parsed?{name:f.name,backup:parsed,confirms:{},ready:false}:{name:f.name,fatal:`${f.name} is not a ledger backup.`});evalReady(ui.uploads[ui.uploads.length-1]);continue}
    const u={name:f.name,text,range:null,confirms:{},personInput:''};
    reparse(u); ui.uploads.push(u);
  }
  renderUpload();
}
function reparse(u){u.parsed=TD.parseReport(u.text,u.name,u.range);u.hash=TD.hashText(u.text);u.plan=(!u.parsed.errors.length&&!u.parsed.needRange&&u.parsed.kind)?TD.planImport(S,u.parsed,u.hash):null;evalReady(u)}
function evalReady(u){
  if(u.fatal||u.applied){u.ready=false;return}
  if(u.backup){u.ready=!!u.confirms.restore;return}
  const p=u.parsed,pl=u.plan; if(!p||p.errors.length||p.needRange||!pl){u.ready=false;return}
  if(pl.duplicate&&!pl.adds.length&&!pl.replaces.length&&p.kind!=='activity'){u.ready=false;return}
  const person=S.person||(p.kind==='activity'?p.summary.name:u.personInput.trim());
  let ok=!!person&&!!u.confirms.person;
  if(pl.replaces&&pl.replaces.length&&!u.confirms.replace)ok=false;
  if(p.kind==='activity'&&pl.summaryReplace&&!u.confirms.replace)ok=false;
  if(p.kind==='activity'&&pl.nameMismatch&&!u.confirms.mapping)ok=false;
  if(p.kind!=='activity'&&!p.records.length)ok=false;
  u.ready=ok;
}
function previewCard(u,i){
  if(u.fatal)return `<div class="pv"><h3>${esc(u.name)}</h3><p class="callout bad" style="margin:0">${esc(u.fatal)}</p></div>`;
  if(u.applied)return `<div class="pv"><h3>${esc(u.name)}</h3><p class="callout good" style="margin:0">${esc(u.applied)}</p></div>`;
  if(u.backup){const n=Object.keys(u.backup.days).length;return `<div class="pv"><h3>Backup: ${esc(u.name)}</h3><p class="note" style="margin:0">${n} dates, ${u.backup.summaries.length} activity summaries, ${u.backup.batches.length} history entries${u.backup.person?' for '+esc(u.backup.person):''}.</p>
    <label class="check"><input type="checkbox" data-i="${i}" data-confirm="restore" ${u.confirms.restore?'checked':''}> Replace everything in this ledger with this backup</label></div>`}
  const p=u.parsed,pl=u.plan; const kindName={hours:'Hours Tracked (Totals)',activity:'Activity Summary',normalized:'date,hours CSV'}[p.kind]||'Unrecognised file';
  let h=`<div class="pv"><h3>${esc(kindName)}</h3><p class="note" style="margin:0">${esc(u.name)}${p.range?` · ${fd(p.range.start,true)} – ${fd(p.range.end,true)}${u.range?' (entered by you)':''}`:''}${pl?` · ${pl.periods.map(k=>pLabel(TD.periodByKey(k))).join(' and ')} payroll period${pl.periods.length>1?'s':''}`:''}</p>`;
  if(p.needRange){h+=`<div class="callout">The filename doesn't include the export dates, so the year of labels like "Wed, Oct 21" can't be worked out. Enter the export range.</div>
    <div class="row"><label class="field"><span>Export start</span><input type="date" id="rs${i}"></label><label class="field"><span>Export end</span><input type="date" id="re${i}"></label><button class="btn" data-act="setRange" data-i="${i}">Preview dates</button></div>`}
  if(p.errors.length)h+=`<p class="callout bad" style="margin:0">${p.errors.length} problem${p.errors.length>1?'s':''} found. Nothing from this file will be saved until the file is fixed.</p><ul class="errs">${p.errors.slice(0,40).map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`;
  if(p.warnings.length)h+=`<ul class="warns">${p.warnings.slice(0,20).map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`;
  if(pl){
    if(p.kind==='activity'){const s=p.summary;
      h+=`<dl class="kv"><dt>Name in report</dt><dd>${esc(s.name)}</dd><dt>Tracked</dt><dd>${HMS(s.tracked)}</dd><dt>Idle</dt><dd>${HMS(s.idle)}</dd><dt>Meetings</dt><dd>${HMS(s.meeting)}</dd><dt>Check against daily totals</dt><dd><span class="pill ${pl.rec.state==='matched'?'good':pl.rec.state==='differ'?'bad':'warn'}">${pl.rec.label}</span></dd></dl>`;
      if(pl.rec.state==='differ')h+=`<p class="note">Daily totals for these dates add up to ${HMS(pl.rec.sum)} (${pl.rec.diff>0?'+':''}${HMS(pl.rec.diff)}). The summary is saved, but the idle estimate waits until they match.</p>`;
      if(pl.rec.state==='needs-daily')h+=`<p class="note">It will be saved and checked once the daily report for the same dates is imported.</p>`;
      if(pl.summaryReplace)h+=`<label class="check"><input type="checkbox" data-i="${i}" data-confirm="replace" ${u.confirms.replace?'checked':''}> Replace the summary already saved for these dates (tracked ${HMS(pl.summaryReplace.tracked)})</label>`;
      if(pl.nameMismatch)h+=`<label class="check"><input type="checkbox" data-i="${i}" data-confirm="mapping" ${u.confirms.mapping?'checked':''}> "${esc(s.name)}" in this report is ${esc(S.person)}</label>`;
    }else{
      h+=`<dl class="kv"><dt>Valid daily rows</dt><dd>${p.records.length}</dd><dt>Total</dt><dd>${HMS(pl.total)}</dd><dt>New dates</dt><dd>${pl.adds.length}</dd><dt>Changed values</dt><dd>${pl.replaces.length}</dd><dt>Already the same</dt><dd>${pl.same.length}</dd></dl>`;
      if(pl.replaces.length)h+=`<div class="tablewrap" style="max-height:160px"><table><thead><tr><th>Date</th><th class="num">Saved now</th><th class="num">In this file</th><th>Saved from</th></tr></thead><tbody>${pl.replaces.map(r=>`<tr><td>${fdw(r.date)}</td><td class="num">${HMS(r.before)}</td><td class="num">${HMS(r.sec)}</td><td>${r.src==='manual'?'<b>Manual edit</b>':'Import'}</td></tr>`).join('')}</tbody></table></div>
        <label class="check"><input type="checkbox" data-i="${i}" data-confirm="replace" ${u.confirms.replace?'checked':''}> Replace ${pl.replaces.length} saved value${pl.replaces.length>1?'s':''}${pl.manualOverrides.length?`, including ${pl.manualOverrides.length} manual edit${pl.manualOverrides.length>1?'s':''}`:''}</label>`;
      if(pl.recs&&pl.recs.length)h+=`<p class="note">After import, Activity Summary check: ${pl.recs.map(x=>`${fd(x.s.start)}–${fd(x.s.end)} <span class="pill ${x.rec.state==='matched'?'good':x.rec.state==='differ'?'bad':'warn'}">${x.rec.label}</span>`).join(' ')}</p>`;
    }
    if(pl.duplicate)h+=`<p class="callout" style="margin:0">This exact file was already imported on ${esc(new Date(pl.duplicate.at).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}))}.${p.kind!=='activity'&&!pl.adds.length&&!pl.replaces.length?' Nothing would change, so there is nothing to apply.':''}</p>`;
    if(!(pl.duplicate&&p.kind!=='activity'&&!pl.adds.length&&!pl.replaces.length)){
      if(!S.person&&p.kind!=='activity')h+=`<label class="field"><span>Whose hours are these?</span><input type="text" data-i="${i}" data-person value="${esc(u.personInput)}" placeholder="Employee name as it appears in Time Doctor"><small>This report has no name in it, so you confirm the person.</small></label>`;
      const who=S.person||(p.kind==='activity'?p.summary.name:u.personInput.trim());
      h+=`<label class="check"><input type="checkbox" data-i="${i}" data-confirm="person" ${u.confirms.person?'checked':''} ${who?'':'disabled'}> This report is for ${who?'<b>'+esc(who)+'</b>':'the person named above'}</label>`;
    }
  }
  return h+'</div>';
}
async function applyUploads(){
  // daily reports first so summaries reconcile against fresh totals
  const order=ui.uploads.map((u,i)=>i).filter(i=>ui.uploads[i].ready&&!ui.uploads[i].applied).sort((a,b)=>(ui.uploads[a].parsed&&ui.uploads[a].parsed.kind==='activity'?1:0)-(ui.uploads[b].parsed&&ui.uploads[b].parsed.kind==='activity'?1:0));
  for(const i of order){
    const u=ui.uploads[i];
    if(u.backup){const nb=JSON.parse(JSON.stringify(u.backup));nb.batches.unshift({id:'r'+Date.now(),type:'restore',file:u.name,at:meta().at,by:'you',detail:Object.keys(nb.days).length+' dates restored',undone:false});
      if(await save(nb)){u.applied='Backup restored.';}continue}
    let base=JSON.parse(JSON.stringify(S));
    if(!base.person&&u.parsed.kind!=='activity')base.person=u.personInput.trim();
    reparseOn(u,base); if(!u.plan){u.fatal='This file no longer applies cleanly. Close and upload it again.';continue}
    const {state:next,batch}=TD.applyImport(base,u.plan,meta());
    if(await save(next)){u.applied=u.parsed.kind==='activity'?`Activity Summary saved for ${fd(u.parsed.range.start)} – ${fd(u.parsed.range.end)}.`:`${batch.changes.length} date${batch.changes.length===1?'':'s'} saved, ${batch.unchanged} unchanged. You can undo this under Imports.`}
    else break;
  }
  for(const u of ui.uploads)if(!u.applied&&!u.fatal&&!u.backup&&u.text)reparse(u);
  renderUpload(); render();
}
function reparseOn(u,base){u.parsed=TD.parseReport(u.text,u.name,u.range);u.plan=(!u.parsed.errors.length&&!u.parsed.needRange)?TD.planImport(base,u.parsed,u.hash):null}

/* ---------------- exports ---------------- */
async function download(filename,data){
  let dl=null;try{dl=window.claude&&typeof window.claude.use==='function'?await window.claude.use('downloads'):null}catch(e){}
  if(!dl){ // standalone site (e.g. GitHub Pages): plain browser download
    try{const url=URL.createObjectURL(new Blob([data],{type:filename.endsWith('.json')?'application/json':'text/csv'}));
      const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
    catch(e){toast('This browser blocked the download.')}
    return}
  try{await dl.save({filename,data:new Blob([data],{type:filename.endsWith('.json')?'application/json':'text/csv'})})}catch(e){if(e&&e.code!=='declined')toast('Download failed: '+(e.message||e.code))}
}

/* ---------------- events ---------------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act],[data-tab]'); if(!b)return;
  if(b.dataset.tab){ui.tab=b.dataset.tab;render();return}
  const a=b.dataset.act, c=()=>calc();
  if(a==='prev'||a==='next'){ui.key=TD.shiftPeriod(curKey(),a==='prev'?-1:1);ui.asOf=null;render()}
  else if(a==='current'){ui.key=null;ui.asOf=null;render()}
  else if(a==='upload'){openUpload()}
  else if(a==='pick'){$('#fileIn').click()}
  else if(a==='closeUp'){$('#dlgUp').close();if(ui.uploads.every(u=>u.applied||u.fatal))ui.uploads=[]}
  else if(a==='setRange'){const i=+b.dataset.i,s=$('#rs'+i).value,en=$('#re'+i).value;if(!TD.isValidISO(s)||!TD.isValidISO(en)||s>en){toast('Enter a start date on or before the end date.');return}ui.uploads[i].range={start:s,end:en};reparse(ui.uploads[i]);renderUpload()}
  else if(a==='applyAll'){b.disabled=true;await applyUploads()}
  else if(a==='edit'){openDay(b.dataset.date)}
  else if(a==='leave'){openLeave()}
  else if(a==='saveLeave'){await saveLeave()}
  else if(a==='tabOff'){ui.tab='off';render();document.querySelector('.tabs').scrollIntoView({behavior:'smooth'})}
  else if(a==='rmLeave'){const d=b.dataset.date;await save(TD.applyManual(S,d,{kind:null,leaveSec:null,reason:null},meta()),`Day off removed from ${fd(d)}.`)}
  else if(a==='hRemove'){const d=b.dataset.date;await saveHolidays(h=>{if(!h.removed.includes(d))h.removed.push(d)},`${fd(d)} is a normal workday again.`,'Removed '+d)}
  else if(a==='hRestore'){const d=b.dataset.date;await saveHolidays(h=>{h.removed=h.removed.filter(x=>x!==d)},`${fd(d)} restored as a holiday.`,'Restored '+d)}
  else if(a==='hDel'){const d=b.dataset.date;await saveHolidays(h=>{h.added=h.added.filter(x=>x.date!==d)},`Holiday on ${fd(d)} deleted.`,'Deleted '+d)}
  else if(a==='hMove'){const d=b.dataset.date;const h=TD.holidayFor(d,S.settings);$('#hMoveBox').innerHTML=`<div class="callout"><b>Move ${esc(h?h.name:'holiday')}</b> from ${fdw(d)} to the announced date:<div class="row" style="margin-top:6px"><label class="field"><span>New date</span><input type="date" id="hMoveTo" value="${d}"></label><button class="btn primary" data-act="hMoveSave" data-date="${d}">Move holiday</button></div></div>`}
  else if(a==='hMoveSave'){const d=b.dataset.date,to=$('#hMoveTo').value;const h=TD.holidayFor(d,S.settings);if(!TD.isValidISO(to)||to===d){toast('Pick a different date.');return}
    if(TD.holidayFor(to,S.settings)){toast(`${fd(to)} is already a holiday.`);return}
    await saveHolidays(x=>{if(!x.removed.includes(d))x.removed.push(d);x.added.push({date:to,name:(h?h.name.replace(/ \(moved from [^)]*\)$/,''):'Holiday')+` (moved from ${fd(d)})`})},`Moved to ${fdw(to)}.`,`Moved ${d} to ${to}`)}
  else if(a==='hAdd'){const d=$('#hDate').value,nm=$('#hName').value.trim();if(!TD.isValidISO(d)||!nm){toast('Enter a date and a name.');return}
    if(TD.holidayFor(d,S.settings)){toast(`${fd(d)} is already a holiday.`);return}
    await saveHolidays(x=>{x.added.push({date:d,name:nm})},`${nm} added on ${fd(d)}.`,`Added ${d}`)}
  else if(a==='closeDay'){$('#dlgDay').close()}
  else if(a==='saveDay'){await saveDay(b.dataset.date)}
  else if(a==='filter'){ui.filter=b.dataset.f;ui.tab='days';render();if(e.target.closest('.m'))document.querySelector('.tabs').scrollIntoView({behavior:'smooth'})}
  else if(a==='toggleTable'){ui.showTable=!ui.showTable;render()}
  else if(a==='undo'){const bt=S.batches.find(x=>x.id===b.dataset.id);if(!bt)return;
    if(bt.type==='leave'){const r=TD.undoLeave(S,bt.id);await save(r.state,`Day off removed from ${r.restored} date${r.restored===1?'':'s'}${r.skipped.length?`; ${r.skipped.length} kept because they were edited later`:''}.`);return}
    if(bt.type==='manual'){const r=TD.undoManual(S,bt.id);if(!r.ok){toast(r.reason||'Could not undo.');return}await save(r.state,'Edit undone.')}
    else{const r=TD.undoBatch(S,bt.id);await save(r.state,`Undone. ${r.restored} restored${r.skipped.length?`, ${r.skipped.length} kept because they were edited later`:''}.`)}}
  else if(a==='saveBasic'){const n=JSON.parse(JSON.stringify(S));n.person=$('#sPerson').value.trim();const tz=$('#sTz').value.trim();
    try{new Intl.DateTimeFormat('en',{timeZone:tz})}catch(err){toast(`"${tz}" is not a time zone.`);return}
    n.settings.tz=tz;const t=parseFloat($('#sTarget').value);n.settings.planningTargetSec=t>0?Math.round(t*3600):null;await save(n,'Settings saved.')}
  else if(a==='saveSched'){const wd=[...document.querySelectorAll('input[name=wd]:checked')].map(x=>+x.value);const hrs=parseFloat($('#sDaily').value);const from=$('#sFrom').value;
    if(!wd.length||!(hrs>0&&hrs<=24)||!TD.isValidISO(from)){toast('Pick at least one workday, hours between 0 and 24, and a start date.');return}
    const curStart=TD.periodByKey(TD.periodKeyFor(today())).start;if(from<curStart&&!$('#sHist').checked){toast('That date is in a closed period. Tick the box to allow recalculating it.');return}
    const n=JSON.parse(JSON.stringify(S));n.settings.schedules=n.settings.schedules.filter(v=>v.from!==from);n.settings.schedules.push({from,workdays:wd.sort(),dailySec:Math.round(hrs*3600)});
    n.batches.unshift({id:'s'+Date.now(),type:'settings',file:'Work schedule',at:meta().at,by:'you',range:{start:from,end:from},detail:`${wd.map(x=>WDS[x]).join(', ')}, ${hrs}h from ${from}${from<curStart?' (recalculates closed periods)':''}`,undone:false});await save(n,'Schedule saved.')}
  else if(a==='savePolicy'){const m=(document.querySelector('input[name=sMeth]:checked')||{}).value||'period';const pct=parseFloat($('#sIdle').value);const from=$('#sPFrom').value;
    if(!(pct>=0&&pct<=100)||!TD.isValidISO(from)){toast('Enter an idle % between 0 and 100 and a start date.');return}
    const curStart=TD.periodByKey(TD.periodKeyFor(today())).start;if(from<curStart&&!$('#sHist').checked){toast('That date is in a closed period. Tick "Allow this change to recalculate closed periods" under Work schedule first.');return}
    const n=JSON.parse(JSON.stringify(S));n.settings.policies=n.settings.policies.filter(v=>v.from!==from);n.settings.policies.push({from,idlePct:pct,shortfallMethod:m,partialLeave:true});
    n.batches.unshift({id:'p'+Date.now(),type:'settings',file:'HR policy rules',at:meta().at,by:'you',range:{start:from,end:from},detail:`${m==='daily'?'Day by day':'Monthly total'}, idle ${pct}%`,undone:false});await save(n,'Policy rules saved.')}
  else if(a==='exportCsv'){const cc=c();await download(`payroll-${cc.P.key}-as-of-${cc.asOf}.csv`,TD.exportCSV(cc,S))}
  else if(a==='exportJson'){await download(`payroll-ledger-backup-${today()}.json`,JSON.stringify(S,null,1))}
  else if(a==='wipe'){if(!$('#sWipe').checked){toast('Tick the confirmation box first.');return}await save(TD.defaultState(),'All data deleted.')}
  else if(a==='migrate'){const n=localPending;localPending=null;if(await save(n,'Moved to your account.'))try{localStorage.removeItem(LS_KEY)}catch(err){}}
  else if(a==='dismissMigrate'){localPending=null;render()}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='asof'){ui.asOf=TD.isValidISO(e.target.value)?e.target.value:null;render()}
  if(e.target.id==='hCountry'){const v=e.target.value;await saveHolidays(h=>{h.country=v},v==='EG'?'Egypt holidays applied.':'Holiday calendar turned off.','Calendar '+v);return}
  if(e.target.id==='incToday'){const n=JSON.parse(JSON.stringify(S));n.settings.includeToday=e.target.checked;await save(n)}
  if(e.target.id==='fileIn'){await addFiles(e.target.files);e.target.value='';if(!$('#dlgUp').open)openUpload()}
});
let dragN=0;
window.addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')&&!$('#dlgUp').open){dragN++;$('#dropall').style.display='grid'}});
window.addEventListener('dragleave',()=>{dragN=Math.max(0,dragN-1);if(!dragN)$('#dropall').style.display='none'});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',async e=>{e.preventDefault();dragN=0;$('#dropall').style.display='none';if($('#dlgUp').open)return;if(e.dataTransfer.files.length){await addFiles(e.dataTransfer.files);openUpload()}});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(mode!=='loading')bindChart(calc())},150)});
$('#dlgDay').addEventListener('close',()=>{ui.sel=null;render()});
boot();
})();
